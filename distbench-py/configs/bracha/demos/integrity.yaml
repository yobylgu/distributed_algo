# INTEGRITY Test: Even if all faulty nodes collude, they cannot lead any
# correct node to deliver a forged message from a correct node.
#
# Setup: n0 is HONEST sender, n8 and n9 are BYZANTINE_SPOOF
# Byzantine nodes try to forge messages claiming to be from honest nodes.
# Dolev's path verification (f+1 disjoint paths) blocks forged messages.
# Expected: Only 10 deliveries (the legitimate message from n0)

n0:
  host: 127.0.0.1
  port: 10000
  neighbours:
  - n2
  - n1
  - n7
  - n9
  is_sender: true
  f: 2
  behavior_mode: HONEST
n1:
  host: 127.0.0.1
  port: 10001
  neighbours:
  - n0
  - n3
  - n4
  - n7
  is_sender: false
  f: 2
  behavior_mode: HONEST
n2:
  host: 127.0.0.1
  port: 10002
  neighbours:
  - n0
  - n5
  - n4
  - n6
  is_sender: false
  f: 2
  behavior_mode: HONEST
