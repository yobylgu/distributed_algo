# AGREEMENT Test (None Deliver Case): Byzantine selective sender with limited reach
# Demonstrates the "NONE deliver" case of all-or-nothing agreement.
#
# Setup: n0 is BYZANTINE_SELECTIVE sender with only 2 neighbors
# - Selective sends to only 1 neighbor (2 // 2 = 1)
# - With f=2, echo threshold = 7, ready threshold = 5
# - 1 node cannot generate enough ECHOs to cascade
# Expected: 0 deliveries (none of the honest nodes deliver)

n0:
  host: 127.0.0.1
  port: 10000
  neighbours:
  - n1
  - n2
  is_sender: true
  f: 2
  behavior_mode: BYZANTINE_SELECTIVE
n1:
  host: 127.0.0.1
  port: 10001
  neighbours:
  - n0
  - n2
  - n3
  - n4
  - n5
  - n6
  is_sender: false
  f: 2
  behavior_mode: HONEST
n2:
  host: 127.0.0.1
  port: 10002
  neighbours:
  - n0
  - n1
  - n3
  - n4
  - n5
  - n7
  is_sender: false
  f: 2
  behavior_mode: HONEST
n3:
  host: 127.0.0.1
  port: 10003
  neighbours:
  - n1
