# Byzantine broadcaster with no totality test
# Node n0 is the sender but is BYZANTINE_SILENT (only sends to some nodes)
# Demonstrates: Byzantine broadcasters break totality - some nodes may deliver while others don't

n0:
  host: "127.0.0.1"
  port: 10000
  neighbours: ["n1","n9","n5"]
  is_sender: true
  payload: "byzantine_broadcast"
  behavior_mode: "BYZANTINE_SILENT"
  f: 1

n1:
  host: "127.0.0.1"
  port: 10001
  neighbours: ["n0","n2","n6"]
  is_sender: false
  payload: "hello"
  behavior_mode: "HONEST"
  f: 1

n2:
  host: "127.0.0.1"
  port: 10002
  neighbours: ["n1","n3","n7"]
  is_sender: false
  payload: "hello"
  behavior_mode: "HONEST"
  f: 1

