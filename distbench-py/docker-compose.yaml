x-common-service: &common-service
  build: .
  volumes:
    - ./configs:/app/configs
    - ./logs:/app/logs
  networks:
    - dolev_network
  environment:
    PYTHONUNBUFFERED: "1"
    TERM: dumb
    NO_COLOR: "1"

services:
  n0:
    <<: *common-service
    container_name: n0
    hostname: n0
    command: >
      sh -c "python -m distbench.main -c ${CONFIG_FILE}
      -a dolev --mode network --id n0 -v > /app/logs/n0.txt 2>&1"

  n1:
    <<: *common-service
    container_name: n1
    hostname: n1
    command: >
      sh -c "python -m distbench.main -c ${CONFIG_FILE}
