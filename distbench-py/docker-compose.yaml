version: "3.9"

services:
  n0:
    build: .
    container_name: n0
    hostname: n0
    command: >
      sh -c "python -m distbench.main -c /app/configs/docker/test_concurrency.yaml
      -a dolev --mode network --id n0 -v > /app/logs/n0.txt 2>&1"
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
    networks:
      - dolev_network
    environment:
      - PYTHONUNBUFFERED=1

