version: '3.8'

# Docker Compose configuration for Dolev's algorithm
# Runs 10 nodes in a (2f+1)-connected network with f=1

services:
  p0:
    build: .
    container_name: dolev-p0
    hostname: p0
    environment:
      NODE_ID: "p0"
      CONFIG_FILE: "/config/dolev-network.yaml"
      ALGORITHM: "dolev"
    volumes:
      - ../configs:/config:ro
      - ./output:/output
    networks:
      dolev_network:
        ipv4_address: 172.25.0.10
    restart: unless-stopped

  p1:
    build: .
    container_name: dolev-p1
    hostname: p1
    environment:
      NODE_ID: "p1"
